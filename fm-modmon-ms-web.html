<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM-Modmon-ms</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* Contrast (WCAG 2.1) on the dark backgrounds: text 4.5:1 or more (dim 4.9, muted 5.9),
   control outlines 3:1 or more (--btn-b 3.3); disabled controls (exempt) stay readable.
   As in the app (ISA-101 high-performance HMI): normal readings in greys, amber and
   red only for what is abnormal. */
:root {
  color-scheme: dark;                 /* native controls, lists and scrollbars drawn dark */
  accent-color: #8ab4f8;              /* checkboxes and sliders in the app's blue */
  --bg: #17181b; --row: #1e1f22; --row-b: #2e3035; --sel: #1f232a; --sel-b: #3d5f8f; --detail: #1b1c20;
  --card: #222328; --card-b: #2a2c31; --track: #2a2c31; --band: #30353c; --plot: #1a1b1f;
  --text: #e0e0e0; --bright: #e3e4e6; --muted: #9aa0a6; --dim: #8c9197; --disabled: #6f747c;
  --normal: #7b8794; --accent: #8ab4f8; --red: #ff6b6b; --amber: #f0a35e;
  --btn: #2b2d31; --btn-b: #6f747c; --btn-bh: #9aa0a6; --btn-h: #33363c; --field: #16171a;
  --lcd: #0b1a0b; --lcd-b: #1f3a1f;
  --cols: 250px minmax(0, 1fr) 300px 176px 150px 28px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 13px "Segoe UI", system-ui, sans-serif; padding: 10px 14px; }
button, select, input { font: inherit; color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }   /* keyboard focus */
button { background: var(--btn); border: 1px solid var(--btn-b); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button:hover:not(:disabled) { background: var(--btn-h); border-color: var(--btn-bh); }
button:disabled, select:disabled, input:disabled { color: var(--disabled); background: #25272b; border-color: #3a3d44; cursor: default; }
button.primary { background: #2f6db5; border-color: #3d7fd0; color: #fff; font-weight: 600; }
button.primary:hover:not(:disabled) { background: #3a7cc6; }
button.primary:disabled { background: #25272b; border-color: #3a3d44; color: var(--disabled); font-weight: normal; }
select { background: var(--btn); border: 1px solid var(--btn-b); border-radius: 6px; padding: 4px 8px; }
option.dim { color: var(--dim); }
select:hover:not(:disabled), input:hover:not(:disabled) { border-color: var(--btn-bh); }
input { background: var(--field); border: 1px solid var(--btn-b); border-radius: 5px; padding: 4px 6px; }
input[type=checkbox] { width: 16px; height: 16px; margin: 0 4px 0 0; vertical-align: -3px; cursor: pointer; }
input:focus, select:focus { border-color: var(--accent); }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
header img { width: 30px; height: 30px; }
header h1 { font-size: 20px; font-weight: 600; color: var(--bright); margin: 0 8px 0 2px; }
.chip { background: #24262b; border: 1px solid #30333a; border-radius: 10px; padding: 3px 10px; color: #c4c7cc; white-space: nowrap; }
header .grow { flex: 1; }
#access { position: relative; color: var(--muted); }
#lock { white-space: nowrap; }
#lock.on { background: #2f6db5; border-color: #8ab4f8; color: #fff; font-weight: 600; }
#lock.on:hover:not(:disabled) { background: #3a7cc6; }
#lock:disabled.on { color: #fff; background: #2f6db5; border-color: #3d5f8f; }
#signin { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; display: none; gap: 6px; align-items: center;
          background: var(--card); border: 1px solid var(--btn-b); border-radius: 8px; padding: 8px;
          box-shadow: 0 6px 18px rgba(0,0,0,.45); flex-wrap: wrap; width: 260px; }
#signin.open { display: flex; }
#signin input { flex: 1; min-width: 0; }
#signin .err { width: 100%; margin: 0; min-height: 0; }
#conn { color: var(--amber); }
#conn:empty { display: none; }

/* station rows: one line per receiver, the same columns as the app */
.colhead, .row { display: grid; grid-template-columns: var(--cols); gap: 12px; align-items: center; }
.colhead { padding: 0 10px 3px; color: var(--dim); font: 600 9.5px/1 Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; }
.row { background: var(--row); border: 1px solid var(--row-b); border-left: 5px solid var(--row); border-radius: 6px; padding: 5px 6px 5px 6px; margin-bottom: 4px; cursor: pointer; }
.row.sel { background: #1c2636; border-color: #5b8fd6; border-left-color: var(--accent); }
.row.sel .freq { color: var(--accent); }
.stn { display: grid; grid-template-columns: auto auto 1fr; column-gap: 6px; row-gap: 2px; align-items: center; min-width: 0; }
.freq { position: relative; font-size: 19px; font-weight: 600; padding: 0 16px 0 3px; border: 1px solid transparent; border-radius: 6px; white-space: nowrap; }
.freq::after { content: '▾'; position: absolute; right: 3px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); }
.freq:hover:not(.off) { border-color: var(--btn-b); }
.freq.off::after { display: none; }
.freq select { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }   /* the list, over the frequency */
.freq select:disabled { cursor: default; }
.ps { font: bold 16px Consolas, monospace; color: #7cfc7c; background: var(--lcd); border: 1px solid var(--lcd-b);
      border-radius: 4px; padding: 1px 5px; white-space: pre; justify-self: start; }
.dyn { font: 600 9px/1 Consolas, monospace; padding: 3px 4px; border-radius: 3px; background: #33363c; color: var(--bright); border: 1px solid #44474e; justify-self: start; }
.meta { grid-column: 1 / -1; color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta b { color: var(--bright); }
.txt { min-width: 0; display: grid; gap: 3px; }
.rt { font: 13px Consolas, monospace; color: #cfe8cf; background: var(--lcd); border: 1px solid var(--lcd-b); border-radius: 4px;
      padding: 2px 6px; white-space: pre; overflow: hidden; text-overflow: ellipsis; min-height: 22px; }
.sub { color: #c4c7cc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 17px; }
.sub .k, .dimt { color: var(--dim); }
.lit { color: var(--bright); font-weight: 700; }
.warn { color: var(--amber); } .alarm { color: var(--red); }
.tapes { display: grid; gap: 1px; min-width: 0; }
.tape { display: grid; grid-template-columns: var(--tn, 34px) 1fr var(--tv, 92px); align-items: center; gap: 6px; height: 16px; }
.tape .n { color: var(--muted); white-space: nowrap; }
.tape .tr { position: relative; height: 7px; background: var(--track); border-radius: 2px; }
.tape .band { position: absolute; top: 0; bottom: 0; background: var(--band); }
.tape .fill { position: absolute; top: 0; bottom: 0; border-radius: 1.5px; background: var(--normal); }
.tape .fill.warn { background: var(--amber); } .tape .fill.alarm { background: var(--red); }
.tape .hold { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--bright); }
.tape .lim { position: absolute; top: -4px; bottom: -1px; width: 1px; background: var(--red); }
.tape .lim::before { content: ''; position: absolute; left: -3.5px; top: -1px; border: 3.5px solid transparent; border-top: 4px solid var(--red); }
.tape .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: #5d6167; }
.tape .v { text-align: right; font-weight: 700; white-space: nowrap; color: var(--bright); }
.trend { display: grid; gap: 1px; min-width: 0; }
.trend .note { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; }
canvas.spark { width: 100%; height: 26px; display: block; }
.ann { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
.lamp { font: 600 9px/1 Consolas, monospace; text-align: center; padding: 4px 0; border-radius: 2px; background: #26282d; color: #7d838a; cursor: help; }
.lamp[data-s=waiting] { color: #4f545a; }
.lamp[data-s=raised] { background: #7a1f26; color: #ffe0e0; box-shadow: inset 0 0 0 1px #c24a52; }
.lamp[data-s=pending] { background: #4a3a1c; color: var(--amber); }
.lamp[data-s=suppressed] { background: repeating-linear-gradient(135deg, #26282d 0 3px, #3a2e1b 3px 6px); color: var(--amber); }
.lamp[data-s=off] { background: transparent; color: #4f545a; box-shadow: inset 0 0 0 1px #3a3d44; }
.rbtn { display: grid; gap: 2px; }
.rbtn button { padding: 0 4px; border-color: transparent; background: transparent; color: var(--muted); line-height: 20px; }
.rbtn button:hover:not(:disabled) { border-color: var(--btn-b); color: var(--text); }
.rbtn button:disabled { background: transparent; border-color: transparent; }

/* the selected receiver's detail */
.detail { background: var(--detail); border: 1px solid var(--sel-b); border-radius: 6px; padding: 6px 8px 8px; margin-top: 2px; }
.dhead { display: flex; align-items: baseline; gap: 10px; padding: 0 2px 6px; flex-wrap: wrap; }
.dhead .t { font-weight: 700; font-size: 14px; }
.dhead .s { flex: 1; color: var(--dim); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dhead .f { color: var(--dim); }
.lines { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; row-gap: 2px; margin-top: 2px; }
.lines .lbl { color: var(--muted); white-space: nowrap; }
.lines .line { color: #c4c7cc; min-width: 0; overflow-wrap: anywhere; }
.lines .mediarow { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 4px; }
.media { width: 88px; height: 88px; display: flex; align-items: center; justify-content: center; position: relative; }
.media img { max-width: 88px; max-height: 88px; border-radius: 4px; cursor: zoom-in; }
.media a { position: absolute; right: 2px; bottom: 2px; padding: 0 4px; border-radius: 4px; background: rgba(0,0,0,.65); color: var(--accent); text-decoration: none; font-size: 12px; }
.cards { display: grid; grid-template-columns: 24fr 26fr 24fr 22fr; gap: 8px; align-items: stretch; }
.card { background: var(--card); border: 1px solid var(--card-b); border-radius: 8px; padding: 6px 10px 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 6px; }
.card-title { flex: 1; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.card-head .x { color: var(--dim); font-size: 11px; }
.card-head button { padding: 0 8px; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); column-gap: 8px; row-gap: 2px; }
.kv.one { grid-template-columns: auto minmax(0, 1fr); }
.kv .k { color: var(--muted); white-space: nowrap; }
.kv .v { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.kv .v.wide { grid-column: 2 / -1; white-space: normal; }   /* long readouts wrap, not cut */
/* essentials / all, the out-of-range line, and what a reading means (on a click, as the app) */
.card-head .allbtn { padding: 0 8px; font-size: 11.5px; }
[data-r] { cursor: help; }
.kv .k[data-r]:hover, .kv .v[data-r]:hover, .tape[data-r]:hover { background: #2c2f36; border-radius: 3px; }
.kv .k.surf::after { content: ' \25B2'; color: var(--amber); font-size: 10px; }
.attn { display: flex; gap: 4px 12px; align-items: baseline; margin: 0 2px 6px; white-space: nowrap; overflow: hidden; }
.attn .more { color: var(--dim); }
.attn .lbl { color: var(--dim); font-size: 10.5px; letter-spacing: .1em; }
.attn .pill { cursor: help; color: var(--amber); }
.attn .pill.alarm { color: var(--red); }
.attn .pill b { margin-left: 4px; }
.graph { position: relative; }
.graph .info { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; line-height: 18px; text-align: center;
               border-radius: 50%; background: rgba(23,24,27,.82); color: var(--muted); font-weight: 700; font-size: 12px; }
.graph .info:hover { background: var(--btn-h); color: var(--bright); }
#explain { position: fixed; z-index: 30; width: min(380px, calc(100vw - 16px)); display: none; background: #24262b;
           border: 1px solid var(--btn-b); border-radius: 8px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
#explain.open { display: block; }
#explain .ex-head { display: flex; gap: 8px; align-items: baseline; }
#explain .ex-head b { flex: 1; font-size: 14px; color: var(--bright); }
#explain .ex-head span { font-weight: 700; }
#explain h4 { margin: 8px 0 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#explain p { margin: 0; line-height: 1.4; color: #c4c7cc; }
#explain details { margin-top: 8px; }
#explain summary { color: var(--accent); cursor: pointer; font-size: 12px; }
#explain details p { margin-top: 4px; font-size: 12px; color: var(--muted); }
.absent { color: var(--dim); font-size: 11px; }
.absent:empty { display: none; }
.cap { color: var(--dim); font-size: 11px; }
canvas { display: block; }
canvas.mpx { width: 100%; height: 140px; }
canvas.hist { width: 100%; height: 64px; }
.stereo { display: flex; gap: 8px; align-items: flex-start; }
.stereo > div { flex: 1; min-width: 0; display: grid; gap: 2px; }
canvas.gonio { width: 104px; height: 104px; flex: none; cursor: pointer; }
.audio-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.audio-row select { min-height: 30px; max-width: 150px; text-overflow: ellipsis; }
.audio-row > button { min-height: 30px; font-weight: 600; min-width: 84px; padding: 4px 10px; }
.audio-row > button.on { background: #2f6db5; border-color: #8ab4f8; color: #fff; }
.audio-row > button.on:hover { background: #3a7cc6; }
.player { display: none; align-items: center; gap: 6px; flex: 1; min-width: 180px; height: 30px; padding: 0 8px;
          background: var(--field); border: 1px solid var(--btn-b); border-radius: 6px; }
.player.on { display: flex; }
.player .live { font: 600 12px Consolas, monospace; color: var(--muted); white-space: nowrap; min-width: 84px; }
.player .live.on { color: var(--bright); }
.player .live.wait { color: var(--amber); }
.player .mute { background: none; border: none; padding: 2px 4px; font-size: 15px; line-height: 1; }
.player .mute:hover { background: var(--btn-h); }
.vol { flex: 1; min-width: 70px; height: 4px; -webkit-appearance: none; appearance: none; border-radius: 2px; cursor: pointer;
       background: linear-gradient(to right, var(--accent) var(--fill, 80%), var(--btn-b) var(--fill, 80%)); }
.vol::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--bright); border: 2px solid var(--accent); }
.vol::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--bright); border: 2px solid var(--accent); }
.vol::-moz-range-track { background: transparent; }
.audio-row .note { color: var(--muted); }

/* alarms (one row each, with its duration) and the event log */
#logs { margin-top: 8px; background: var(--card); border: 1px solid var(--card-b); border-radius: 8px; padding: 6px 10px 8px; }
.tabs { display: flex; gap: 2px; margin-bottom: 4px; }
.tabs button { background: transparent; border: none; color: var(--muted); padding: 2px 10px; border-radius: 4px; }
.tabs button.on { background: var(--btn); color: var(--bright); }
.tabs button.red { color: var(--red); }
#alarms, #log { background: var(--field); border-radius: 6px; height: 110px; overflow: auto; }
#log { padding: 6px 8px; font: 12px Consolas, monospace; color: #c4c7cc; white-space: pre; }
#alarms table { border-collapse: collapse; width: 100%; font-size: 12px; }
#alarms th { text-align: left; color: var(--muted); font-weight: 600; padding: 3px 8px; position: sticky; top: 0; background: var(--field); }
#alarms td { padding: 2px 8px; white-space: nowrap; color: #c4c7cc; }
#alarms tr.on td { color: var(--red); }
#alarms td:last-child { white-space: normal; }

dialog { background: var(--card); color: var(--text); border: 1px solid var(--btn-b); border-radius: 10px; padding: 16px; max-width: 640px; width: 95vw; }
#settings { max-width: 780px; }
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog h2 { margin: 0 0 12px; font-size: 16px; color: var(--accent); }
.form { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
.form label.k { text-align: right; color: var(--muted); }
fieldset { grid-column: 1 / span 2; border: 1px solid var(--btn-b); border-radius: 8px; }
legend { color: var(--accent); }
.alarm-grid { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 4px 8px; align-items: center; }
.alarm-grid input[type=number] { width: 64px; }
.alarm-grid .limit-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.alarm-grid > label { white-space: nowrap; }
@media (max-width: 520px) { .alarm-grid > label { white-space: normal; } }
.buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.err { color: var(--red); margin-top: 8px; min-height: 1em; }
#help-btn { width: 32px; height: 32px; padding: 0; border-radius: 16px; font-weight: 700; font-size: 15px; color: var(--accent); }
#helpdlg { max-width: 960px; width: 96vw; padding: 0; }
#stereo { max-width: min(94vw, 640px); width: 640px; padding: 0 0 12px; }
#stereo .help-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; }
#stereo .help-head h2 { margin: 0; }
#stereo-scope { display: block; width: calc(100% - 32px); aspect-ratio: 1; margin: 0 16px; border-radius: 6px; }
#stereo-phase { margin: 10px 16px 0; --tn: 50px; --tv: 60px; }
#stereo-readouts { margin: 6px 16px 0; color: var(--muted); text-align: center; }
#stereo-readouts b { color: var(--text); }
canvas.mpx { cursor: pointer; }
#mpxwin { max-width: 94vw; width: 960px; padding: 0 0 12px; }
#mpxwin .help-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; }
#mpxwin .help-head h2 { margin: 0; }
#mpx-big { display: block; width: calc(100% - 32px); height: min(60vh, 420px); margin: 0 16px; border-radius: 6px; }
#mpx-readouts { margin: 8px 16px 0; color: var(--muted); text-align: center; }
#mpx-readouts b { color: var(--text); }
#helpdlg .help-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0; }
#helpdlg .help-head h2 { margin: 0; }
#help-toc { padding: 6px 16px; color: var(--muted); }
#help-toc a { color: var(--accent); cursor: pointer; margin-right: 12px; }
#help-body { max-height: 75vh; overflow: auto; padding: 0 16px 16px; }
#help-body h3 { color: var(--accent); margin: 16px 0 6px; font-size: 15px; }
#help-body pre { font: 12px Consolas, monospace; color: #d6d8dc; white-space: pre-wrap; margin: 0; }
#help-body p { margin: 0 0 8px; line-height: 1.45; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #3a1d1f; color: #ffb3b3;
         border: 1px solid #6b2a2e; border-radius: 8px; padding: 8px 14px; display: none; max-width: 90vw; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; }
#zoom img { max-width: 90vw; max-height: 90vh; }

/* narrower screens: cards two by two, then the row's columns wrap */
@media (max-width: 1250px) { .cards { grid-template-columns: 1fr 1fr; } }
@media (max-width: 1100px) {
  :root { --cols: 230px minmax(0, 1fr) 260px 28px; }
  .colhead span:nth-child(4), .colhead span:nth-child(5) { display: none; }
  .row .trend, .row .ann { grid-row: 2; }
  .row .trend { grid-column: 1 / 3; } .row .ann { grid-column: 3 / 5; }
}
@media (max-width: 700px) {
  body { padding: 8px; }
  :root { --cols: minmax(0, 1fr) 28px; }
  .colhead { display: none; }
  .row .stn { grid-column: 1; grid-row: 1; } .row .rbtn { grid-column: 2; grid-row: 1; }
  .row .txt, .row .tapes, .row .trend, .row .ann { grid-column: 1 / -1; grid-row: auto; }
  .cards { grid-template-columns: 1fr; }
  .kv { grid-template-columns: auto minmax(0, 1fr); }
  .kv .v { white-space: normal; }
  .media { display: none !important; }
  /* header: title with sign-in and help on one row, the chips as one sideways-scrolling
     strip, then the two action buttons side by side */
  header img { order: 0; } header h1 { order: 1; margin-right: auto; }
  #access { order: 2; } #help-btn { order: 3; }
  #chips { display: flex !important; order: 4; flex: 0 0 100%; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  header .grow { display: none; }
  #conn { order: 5; flex-basis: 100%; }
  #cal, #add { order: 6; flex: 1 1 0; white-space: nowrap; }
}
</style>
</head>
<body>
<header>
  <img src="icon.png" alt="">
  <h1>FM-Modmon-ms</h1>
  <span id="chips"></span>
  <span class="grow"></span>
  <span id="conn"></span>
  <span id="access">
    <button id="lock">&#x1F512;&nbsp; View only</button>

<script>
'use strict';
const $ = (sel, el = document) => el.querySelector(sel);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let state = null, control = false, eventsSeq = -1, failures = 0;
const recv = new Map();     // receiver number -> {row, detail and their parts}
let selected = (() => { try { return +sessionStorage.getItem('fm-modmon-ms-selected') || null; } catch (e) { return null; } })();

// ---------------------------------------------------------------- helpers
function setText(el, text) { if (el.textContent !== text) el.textContent = text; }
// A readout: plain text, or a list of pieces, each text or [text, class] (classes
// only from this page: 'warn', 'alarm', 'dimt', 'lit'). Station-supplied text only
// ever goes in as text.
function setParts(el, parts) {
  const sig = JSON.stringify(parts);
  if (el._sig === sig) return;
  el._sig = sig;
  if (!Array.isArray(parts)) { el.textContent = parts == null ? '-' : String(parts); }
  else el.replaceChildren(...parts.map(p => Array.isArray(p) ? h('span', p[1] || null, p[0]) : document.createTextNode(p)));
  el.title = el.textContent;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = 'none', 6000);
}
// Signed-in session: kept in this tab's sessionStorage, so closing the tab
// signs out and a reload doesn't.
const session = {
  token: (() => { try { return sessionStorage.getItem('fm-modmon-ms-session') || ''; } catch (e) { return ''; } })(),
  set(t) { this.token = t || ''; try { t ? sessionStorage.setItem('fm-modmon-ms-session', t) : sessionStorage.removeItem('fm-modmon-ms-session'); } catch (e) {} },
};
function headers(json) {
  const hd = {'X-FM-Modmon': '1', 'X-FM-Modmon-Session': session.token};
  if (json) hd['Content-Type'] = 'application/json';
  return hd;
}
async function post(action, args = {}) {
  try {
    const r = await fetch('api/' + action, {method: 'POST', headers: headers(true), body: JSON.stringify(args)});
    return [r.ok, await r.json().catch(() => ({error: 'HTTP ' + r.status}))];
  } catch (e) { return [false, {error: 'FM-Modmon-ms is not answering'}]; }
}
async function api(action, args = {}) {
  const [ok, body] = await post(action, args);
  if (!ok) { toast(body.error || 'failed'); return false; }
  poll(true);
  return true;
}
function fillSelect(sel, items, value) {
  // Rebuild only when the list changes, and never while it is open.
  const sig = JSON.stringify(items);
  if (sel._sig !== sig && document.activeElement !== sel) {
    sel._sig = sig;
    sel.replaceChildren(...items.map(it => { const o = h('option', null, it.label); o.value = JSON.stringify(it.value);
                                             o.disabled = !it.enabled; o.title = it.tip || '';
                                             if (it.dim) o.className = 'dim';   // not on this station (still selectable)
                                             return o; }));
  }
  if (document.activeElement !== sel) sel.value = JSON.stringify(value);
}

// ---------------------------------------------------------------- readouts, as the app formats them
const fin = v => v != null && isFinite(v);
const fx = (v, d = 1) => fin(v) ? v.toFixed(d) : '-';
const num = (v, unit, d = 1) => (fin(v) ? v.toFixed(d) : '-∞') + ' ' + unit;
const sgn = (v, d = 1) => fin(v) ? (v >= 0 ? '+' : '') + v.toFixed(d) : '-';
const RTPLUS_ALARM = 27;

function flagParts(f) {
  if (!f) return '-';
  const lit = (name, on) => [name, on ? 'lit' : 'dimt'];
  return [lit('TP', f.TP), ' ', lit('TA', f.TA), ' ', [f.music ? 'Music' : 'Speech', 'lit'], ' ',
          lit('DI-Stereo', f.stereo), ' ', lit('AH', f.AH), ' ', lit('CMP', f.CMP)];
}
function scaParts(kind, baud) {
  return {audio: ['AUDIO'], data: ['DATA' + (baud ? ` ~${baud.toFixed(0)} Bd` : ''), [' (not audio)', 'dimt']],
          tone: ['TONE'], idle: [['IDLE (no modulation)', 'dimt']], weak: ['PRESENT ', ['(too weak to tell)', 'dimt']],
          checking: ['PRESENT ', ['(checking…)', 'dimt']]}[kind] || [];
}
function readouts(r) {
  const o = {}, L = k => (r.levels || {})[k] || null;
  o['PI'] = r.pi == null ? '-' : [[r.pi, L('pi')]]; o['PTY'] = r.pty ?? '-'; o['PTYN'] = r.ptyn || '-';
  o['ECC'] = r.ecc == null ? '-' : r.ecc ? r.ecc.toString(16).toUpperCase().padStart(2, '0') : '00 (not set)';
  o['Groups/s'] = fx(r.rds_rate);
  o['Group loss'] = r.rds_loss_pct == null ? '-' : fx(r.rds_loss_pct, 0) + '%';
  o['Flags'] = flagParts(r.flags);
  o['ODA'] = (r.oda || []).join(', ') || '-';
  o['Alt. freqs'] = r.af || '-';
  if (r.clock) {
    const off = Math.abs(r.clock[1]);
    o['Clock'] = `${r.clock[0]} local (UTC${r.clock[1] < 0 ? '-' : '+'}${Math.floor(off / 60)}:${String(off % 60).padStart(2, '0')})`;
  } else o['Clock'] = '-';
  o['Group types'] = (r.group_types || []).slice(0, 5).map(([k, p]) => `${k} ${p.toFixed(0)}%`).join('  ') || '-';
  const ds = [];
  for (const d of r.data_services || []) {
    if (ds.length) ds.push('  ·  ');
    ds.push(d.label);
    if (d.paging && d.paging.length) ds.push([` (${d.paging.join(', ')})`, 'dimt']);
    if (d.share_pct != null) ds.push(` ${d.share_pct.toFixed(0)}%`);
  }
  for (const k of r.data_lost || []) { if (ds.length) ds.push('  ·  '); ds.push([k + ' lost', 'alarm']); }
  o['Data services'] = ds.length ? ds : '-';
  if (r.has_signal) {
    o['RF level'] = [[num(r.rf_dbfs, 'dBFS'), L('rf_dbfs')]];
    o['MPX S/N'] = num(r.snr_db, 'dB');
    o['Carrier offset'] = [[`${sgn(r.offset_hz, 0)} Hz`, L('offset_hz')]];
    o['AM / multipath'] = [[fx(r.am_pct) + '%' + ({warn: '  peaks unreliable', alarm: '  readings unreliable'}[L('am_pct')] || ''), L('am_pct')]];
    o['Pilot freq'] = r.pilot_hz == null ? '-' : [[`${fx(r.pilot_hz)} Hz (${sgn(r.pilot_hz - 19000)})`, L('pilot_hz')]];
    o['RDS injection'] = fx(r.rds_pct) + '%';
    const mode = r.rds_phase_mode;
    o['RDS phase'] = mode == null ? '-' : mode === 'drifting' ? [['drifting: not locked to the pilot', L('rds_phase_deg')]]
                   : [[`${sgn(Math.round(r.rds_phase_deg), 0)}° (${mode}, locked)`, L('rds_phase_deg')]];
    if (r.sync_am_pct == null) o['Sync AM'] = '-';
    else {
      const db = r.sync_am_pct ? 20 * Math.log10(r.sync_am_pct / 100) : -Infinity;
      const t = `${r.sync_am_pct.toFixed(2)}%  (${fin(db) ? db.toFixed(0) : '-∞'} dB)`;
      o['Sync AM'] = r.sync_am_multipath ? [[t + '  multipath', 'dimt']] : [[t, L('sync_am_pct')]];
    }
    o['IBOC signal'] = r.iboc_found === 'detected' ? `detected, ${fx(r.iboc_dbc, 0)} dBc`
      : [[{unscanned: 'unknown (not scanned)', adjacent: 'unknown (adjacent station)', absent: 'not detected'}[r.iboc_found], 'dimt']];
    for (const k of [67, 92]) {
      const pct = r[`sca${k}_pct`];
      o[`SCA ${k} kHz`] = pct == null ? [['none', 'dimt']] : [`${pct.toFixed(1)}%  `, ...scaParts(r[`sca${k}_kind`], r[`sca${k}_baud`])];
    }
    o['Peak deviation'] = `${fx(r.dev_khz)} kHz (${fx(r.dev_khz / 0.75, 0)}%)`;
    o['Over 100%'] = `${r.over100_min} /min`; o['Over 110%'] = `${r.over110_min} /min`;
    o['MPX power'] = `${sgn(r.mpx_dbr)} dBr` + (r.mpx_window_s >= 60 ? '' : `  (${fx(r.mpx_window_s, 0)} s)`);
    o['Limit'] = `${fx(r.limit_pct)}%`;
    const span = r.valid_window_s >= 60 ? `${(r.valid_window_s / 60).toFixed(0)} min` : `${fx(r.valid_window_s, 0)} s`;
    o['Valid time'] = r.valid_pct == null ? '-' : [[`${fx(r.valid_pct, 0)}% of ${span}`, L('valid_pct')],
                                                    ...(r.invalid_why ? [[`  now: ${r.invalid_why}`, 'dimt']] : [])];
    const held = r.exceed_valid_s < 900 ? `${(r.exceed_valid_s / 60).toFixed(0)} of 15 min valid` : 'last 15 min valid';
    o['Over-deviation (15 min)'] = r.exceed_frac == null ? '-' : [[`${(r.exceed_frac * 1e6).toFixed(2)} ppm of samples over ${fx(r.exceed_khz)} kHz`,
                                                   L('exceed_frac')], [`  (limit 1 ppm; ${held})`, 'dimt']];
    o['Peak balance'] = r.asym_pct == null ? '-' : L('asym_pct')
      ? [[`${r.asym_pct > 0 ? '+' : '−'} ${Math.abs(r.asym_pct).toFixed(0)}% higher: a station ${r.asym_pct > 0 ? 'above' : 'below'}?`, 'warn']]
      : `even (${sgn(r.asym_pct)}%)`;
    o['Noise >100 kHz'] = [[num(r.hf_noise_db, 'dB', 0), L('hf_noise_db')],
                           [`  (±${fx(r.peak_noise_pct * 0.75, 2)} kHz RMS on peaks)`, 'dimt']];
    o['Pilot AM'] = r.pilot_am_pct == null ? '-' : [[fx(r.pilot_am_pct) + '%', L('pilot_am_pct')]];
  }
  if (r.has_audio) {
    const pct = k => [fx(r[k], 0) + '%', L(k)];
    o['L / R'] = [pct('mod_l'), ' / ', pct('mod_r')];
    o['L+R / L−R'] = [pct('mod_m'), ' / ', pct('mod_s')];
    o['Momentary'] = num(r.momentary, 'LUFS'); o['Short-term'] = num(r.short_term, 'LUFS');
    o['Integrated'] = num(r.integrated, 'LUFS');
    o['True peak L/R'] = `${fx(r.tp_l)} / ${fx(r.tp_r)} dBTP`;
    o['Level L/R'] = `${num(r.rms_l, '')}/ ${num(r.rms_r, 'dB')}`;
    const bal = r.balance_db || 0;
    o['Balance'] = Math.abs(bal) < 0.5 ? 'centre' : `${Math.abs(bal).toFixed(1)} dB ${bal > 0 ? 'L' : 'R'}`;
    o['Correlation'] = [[sgn(r.correlation, 2), L('correlation')]];
    o['Width (S/M)'] = !fin(r.width_db) || r.width_db < -40 ? 'mono' : num(r.width_db, 'dB');
  }
  return o;
}
// The readouts a station doesn't carry, hidden and listed once (as the app's _collapse).
function collapse(r) {
  let rds = [], mpx = [];
  if (r.pi == null) rds = ['PI', 'PTY', 'PTYN', 'ECC', 'Group loss', 'Flags', 'ODA', 'Alt. freqs', 'Clock', 'Group types', 'Data services'];
  else rds = [['PTYN', !r.ptyn], ['ECC', r.ecc == null], ['ODA', !(r.oda || []).length], ['Alt. freqs', !r.af],
              ['Clock', !r.clock], ['Data services', !(r.data_services || []).length && !(r.data_lost || []).length]]
             .filter(x => x[1]).map(x => x[0]);
  if (r.has_signal) mpx = [['Pilot freq', r.pilot_hz == null], ['Pilot AM', r.pilot_am_pct == null], ['RDS injection', r.pi == null], ['RDS phase', r.rds_phase_mode == null],
                           ['Sync AM', r.sync_am_pct == null], ['SCA 67 kHz', r.sca67_pct == null], ['SCA 92 kHz', r.sca92_pct == null],
                           ['IBOC signal', r.iboc_found !== 'detected']].filter(x => x[1]).map(x => x[0]);
  const short = {'SCA 67 kHz': 'SCA 67', 'SCA 92 kHz': 'SCA 92', 'IBOC signal': 'IBOC', 'RDS injection': 'RDS'};
  const onAir = mpx.filter(n => n in short).map(n => short[n]);
  return {hidden: new Set([...rds, ...mpx]),
          rds: r.pi == null ? 'No RDS decoded' : rds.length ? 'Not sent: ' + rds.join(' · ') : '',
          mpx: onAir.length ? 'Not on air: ' + onAir.join(' · ') : ''};
}
function ibocParts(ib) {
  if (!ib) return '-';
  const name = {0: 'HD1', 1: 'HD2', 2: 'HD3', 3: 'HD4'}[ib.program] || `HD${ib.program + 1}`;
  const parts = [name + (ib.service != null ? ` (${ib.service})` : ''), '  ·  ', ib.synced ? 'synchronized' : ['searching…', 'warn']];
  if (ib.kbps) parts.push(`  ·  ${ib.kbps.toFixed(0)} kbps`);
  if (ib.mer_db != null) parts.push(`  ·  MER ${ib.mer_db.toFixed(1)} dB`);
  if (ib.ber != null) parts.push(`  ·  BER ${ib.ber.toExponential(1)}`);
  if (ib.dropped) parts.push('  ·  ', [`${ib.dropped} blocks dropped`, 'alarm']);
  if (ib.alert) parts.push('  ·  ', [`ALERT: ${ib.alert}`, 'alarm']);
  return parts;
}
function psdSis(ib) {
  if (!ib) return ['-', '-'];
  const song = [ib.artist, ib.title].filter(Boolean).join(' – ');
  return [[song, ib.album, ib.genre, ib.comment].filter(Boolean).join('  ·  ') || '-',
          [ib.name, ib.slogan, ib.message].filter(Boolean).join('  ·  ') || '-'];
}

// ---------------------------------------------------------------- painted parts
function canvasCtx(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), hgt = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== hgt) { cv.width = w; cv.height = hgt; }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [c, r.width, r.height];
}
const C = {normal: '#7b8794', red: '#ff6b6b', amber: '#f0a35e', plot: '#1a1b1f', grid: '#3c4043', axis: '#9aa0a6', faint: '#5d6167', bright: '#e3e4e6'};
// A tape: the value from its origin, the normal range as a band, a limit notch, a 2 s peak hold.
function makeTape(name, lo, hi, opts = {}) {
  const el = h('div', 'tape'), tr = h('div', 'tr'), band = h('div', 'band'), fill = h('div', 'fill'), v = h('span', 'v', '-');
  tr.append(band, fill);
  const t = {el, lo, hi, origin: opts.origin ?? lo, band: opts.band || null, hold: opts.hold ? [] : null};
  if (opts.origin != null) { const z = h('div', 'zero'); tr.append(z); t.zero = z; }
  if (opts.hold) { t.holdEl = h('div', 'hold'); tr.append(t.holdEl); }
  t.limEl = h('div', 'lim'); t.limEl.style.display = 'none'; tr.append(t.limEl);
  el.append(h('span', 'n', name), tr, v);
  t.v = v;
  if (opts.nameW) el.style.setProperty('--tn', opts.nameW + 'px');
  if (opts.valW) el.style.setProperty('--tv', opts.valW + 'px');
  const pos = x => 100 * (Math.min(Math.max(x, t.lo), t.hi) - t.lo) / (t.hi - t.lo);
  t.set = (value, text, st, limit, bandNow) => {
    setText(v, text); v.className = 'v ' + (st && st !== 'off' ? st : '');
    if (bandNow) t.band = bandNow;
    if (t.band) Object.assign(band.style, {display: '', left: pos(t.band[0]) + '%', width: (pos(t.band[1]) - pos(t.band[0])) + '%'});
    else band.style.display = 'none';
    if (t.zero) t.zero.style.left = pos(t.origin) + '%';
    if (!fin(value)) { fill.style.display = 'none'; if (t.holdEl) t.holdEl.style.display = 'none'; t.limEl.style.display = 'none'; return; }
    const a = pos(t.origin), b = pos(value);
    Object.assign(fill.style, {display: '', left: Math.min(a, b) + '%', width: Math.max(Math.abs(b - a), 0.8) + '%'});
    fill.className = 'fill ' + (st || '');
    if (t.hold) {
      const now = Date.now(); t.hold.push([now, value]);
      while (t.hold.length && now - t.hold[0][0] > 2000) t.hold.shift();
      Object.assign(t.holdEl.style, {display: '', left: pos(Math.max(...t.hold.map(x => x[1]))) + '%'});
    }
    if (fin(limit)) Object.assign(t.limEl.style, {display: '', left: pos(limit) + '%'}); else t.limEl.style.display = 'none';
  };
  return t;
}
// Sparkline: the trend as a filled line, the limit dashed with excursions over it filled.
function drawSpark(cv, data, lo, hi, limit, excess, ref) {
  const [c, w, hgt] = canvasCtx(cv);
  c.fillStyle = C.plot; c.fillRect(0, 0, w, hgt);
  const n = (data || []).length, ok = v => v != null && v > -998;
  const y = v => hgt - 2 - (hgt - 4) * (Math.min(Math.max(v, lo), hi) - lo) / (hi - lo), x = i => 1 + i * (w - 2) / Math.max(n - 1, 1);
  if (ref != null) { c.strokeStyle = C.faint; c.setLineDash([1, 2]); c.beginPath(); c.moveTo(0, y(ref)); c.lineTo(w, y(ref)); c.stroke(); c.setLineDash([]); }
  let run = [];
  const flush = () => {
    if (run.length > 1) {
      c.beginPath(); c.moveTo(x(run[0]), hgt - 2); for (const i of run) c.lineTo(x(i), y(data[i])); c.lineTo(x(run[run.length - 1]), hgt - 2);
      c.fillStyle = 'rgba(123,135,148,0.18)'; c.fill();
      c.beginPath(); run.forEach((i, k) => k ? c.lineTo(x(i), y(data[i])) : c.moveTo(x(i), y(data[i])));
      c.strokeStyle = C.normal; c.lineWidth = 1.1; c.stroke();
    }
    run = [];
  };
  for (let i = 0; i < n; i++) { if (ok(data[i])) run.push(i); else flush(); }
  flush();
  if (limit != null) {
    c.fillStyle = excess;
    for (let i = 0; i < n; i++) if (ok(data[i]) && data[i] > limit) c.fillRect(x(i) - 0.8, y(data[i]), 1.8, y(limit) - y(data[i]));
    c.strokeStyle = C.red; c.setLineDash([2, 2]); c.lineWidth = 1; c.beginPath(); c.moveTo(0, y(limit)); c.lineTo(w, y(limit)); c.stroke(); c.setLineDash([]);

// Play: the source (shared with the app) and this browser's player.
function buildAudio(p) {
  const n = p.n, ar = h('div', 'audio-row');
  p.source = h('select'); p.source.title = 'Audio source (the app and this player)';
  p.source.onchange = () => api('source', {receiver: n, source: JSON.parse(p.source.value)}).then(() => p.source.blur());
  // The player gets its stream only once Listen is pressed (browsers probe
  // any src they're given), and shows while listening, for volume and pause.
  p.listen = h('button', null, '▶  Listen');
  p.listen.title = 'Play this receiver in this browser (a few seconds behind the air)';
  p.format = h('select'); p.format.title = 'Audio format for this receiver in this browser (remembered)';
  p.audioFormat = savedFormat(n);
  p.format.onchange = () => {
    setAudioFormat(p, JSON.parse(p.format.value));
    if (p.listening) { p.stop(); p.listen.onclick(); }   // switch the stream now
  };
  // The player: our own controls over a hidden <audio>, styled like the app.
  // A live stream can't pause and resume, so Listen / Stop starts and ends it.
  p.player = h('audio'); p.player.preload = 'none';
  p.listening = false;
  p.live = h('span', 'live');
  p.mute = h('button', 'mute'); p.mute.title = 'Mute';
  p.vol = h('input', 'vol'); p.vol.type = 'range'; p.vol.min = 0; p.vol.max = 100; p.vol.title = 'Volume';
  p.mute.onclick = () => setVolume(volume.level, !volume.muted);
  p.vol.oninput = () => setVolume(+p.vol.value, false);
  const playerUi = h('span', 'player'); playerUi.append(p.live, p.mute, p.vol);
  p.stop = () => {
    if (!p.listening) return;
    p.listening = false;
    p.player.pause(); p.player.removeAttribute('src'); p.player.load();  // closes the stream
    p.listen.classList.remove('on'); setText(p.listen, '▶  Listen');
    playerUi.classList.remove('on');
    clearInterval(p.liveTimer);
  };
  p.listen.onclick = () => {
    if (p.listening) { p.stop(); return; }
    for (const q of recv.values()) if (q !== p) q.stop();  // one at a time
    p.listening = true; p.since = null; p.playState = 'connecting…';
    p.listen.classList.add('on'); setText(p.listen, '■  Stop');
    playerUi.classList.add('on');
    applyVolume(p);
    const src = p.player.src = `audio/${n}.${p.audioFormat}?t=${Date.now()}`;
    p.player.play().catch(e => {
      // Stop (or a format change) while it was still buffering cancels the start:
      // that's on purpose, not a fault, so say nothing.
      if (e.name === 'AbortError' || !p.listening || !p.player.src.endsWith(src)) return;
      p.stop(); toast(`receiver ${n}: ${e.message}`);
    });
    showLive(p);
    clearInterval(p.liveTimer);
    p.liveTimer = setInterval(() => showLive(p), 500);   // the LIVE clock, whatever the data rate
  };
  p.player.addEventListener('playing', () => { p.since = p.since || Date.now(); p.playState = null; showLive(p); });
  p.player.addEventListener('waiting', () => { if (p.listening) { p.playState = 'buffering…'; showLive(p); } });
  p.player.addEventListener('error', () => { if (p.listening) { p.stop(); toast(`receiver ${n}: the audio stream failed`); } });
  p.note = h('span', 'note');
  ar.append(p.listen, p.source, p.format, playerUi, p.note);
  applyVolume(p);
  return ar;
}

function select(n) {

// Player volume: one setting for all receivers, remembered in this browser.
const volume = (() => {

  catch (e) { return {level: 80, muted: false}; }
})();
function setVolume(level, muted) {
  volume.level = Math.max(0, Math.min(100, level)); volume.muted = muted;
  try { localStorage.setItem('fm-modmon-ms-volume', JSON.stringify(volume)); } catch (e) {}
  for (const q of recv.values()) applyVolume(q);

function applyVolume(p) {

  if (document.activeElement !== p.vol) p.vol.value = volume.level;
  p.vol.style.setProperty('--fill', (volume.muted ? 0 : volume.level) + '%');
  setText(p.mute, volume.muted || !volume.level ? '\u{1F507}' : volume.level < 50 ? '\u{1F509}' : '\u{1F50A}');
  p.mute.title = volume.muted ? 'Unmute' : 'Mute';
}
function showLive(p) {
  if (!p.listening) { setText(p.live, ''); p.live.className = 'live'; return; }
  if (p.playState || !p.since) { setText(p.live, p.playState || 'connecting…'); p.live.className = 'live wait'; return; }
  const s = Math.floor((Date.now() - p.since) / 1000);
  setText(p.live, `● LIVE ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`);
  p.live.className = 'live on';
}

  const rulesSel = $('#s-rules');
  rulesSel.value = s.rules || '';
  const preset = () => rulesSel.value === 'custom' ? null : R.presets[rulesSel.value || R.by_country];
  fillLimits(preset() || s);
  rulesSel.onchange = () => { if (preset()) fillLimits(preset()); };
  for (const i of limitInputs) i.oninput = () => { rulesSel.value = 'custom'; };
  $('#s-err').textContent = '';
  dlg.returnValue = '';
  dlg.onclose = null;
  $('#s-ok').onclick = async ev => {
    ev.preventDefault();
    if (!$('#settings-form').reportValidity()) return;
    const num = id => Number($('#s-' + id).value);
    const settings = {
      name: $('#s-name').value.trim(), deemphasis_us: num('deemph'), stereo: $('#s-stereo').value,
      volume_pct: num('volume'), pty_names: $('#s-pty').value, expected_pi: $('#s-pi').value.trim().toUpperCase(),
      service_names: $('#s-names').value.trim(),
      rds_feed: $('#s-feed').checked, rds_port: num('port'),
      alarms: Object.fromEntries([...ag.querySelectorAll('input[data-alarm]')].map(cb => [cb.dataset.alarm, cb.checked])),
      min_snr_db: num('min_snr_db'), silence_lufs: num('silence_lufs'), silence_s: num('silence_s'), rules: $('#s-rules').value,
      ...Object.fromEntries(R.limits.map(([id]) => [id, num(id)])),
    };
    const [ok, body] = await post('settings', {receiver: n, settings});
    if (ok) { dlg.close(); poll(true); } else $('#s-err').textContent = body.error || 'not saved';
  };
  dlg.showModal();
}

// ---------------------------------------------------------------- page
// The lock button: "View only" until signed in (click for the password),
// green "Controls on" when signed in (click to sign out).
const lock = $('#lock'), signin = $('#signin'), pw = $('#signin input'), signinErr = $('#signin .err');
function closeSignin() { signin.classList.remove('open'); pw.value = ''; signinErr.textContent = ''; }
async function login() {
  if (!pw.value) return;
  const [ok, body] = await post('login', {password: pw.value});
  if (ok && body.token) { session.set(body.token); closeSignin(); poll(true); }
  else { signinErr.textContent = body.error || 'not signed in'; pw.select(); }
}
lock.onclick = async () => {
  const a = state && state.access;
  if (!a || !a.password) return;
  if (a.control) {                                  // signed in: sign out
    await post('logout'); session.set(''); poll(true);
  } else if (signin.classList.toggle('open')) {
    pw.focus();
  } else closeSignin();
};
$('#signin button').onclick = login;
pw.onkeydown = e => { if (e.key === 'Enter') login(); else if (e.key === 'Escape') closeSignin(); };
document.addEventListener('click', e => { if (!$('#access').contains(e.target)) closeSignin(); });

function renderAccess(a) {
  if (a.password && !a.control && session.token) session.set('');  // the session ended on the server
  const on = a.control;
  lock.classList.toggle('on', on);
  lock.disabled = !a.password;   // without a password nothing to sign in or out of
  setText(lock, on ? (a.password ? '\u{1F513}  Controls on' : '\u{1F513}  Controls on (this PC)') : '\u{1F512}  View only');
  lock.title = on ? (a.password ? 'Signed in: click to sign out' : 'Controls work here because this browser is on the FM-Modmon-ms PC')
             : a.password ? 'Click to sign in and use the controls'
             : 'The controls work in a browser on the FM-Modmon-ms PC (http://localhost:' + location.port + '/), or from anywhere once a web password is set (Settings > Run setup again on that PC)';
  if (on) closeSignin();
}

// ---------------------------------------------------------------- alarms and events
function duration(s) {
  s = Math.max(0, Math.floor(s));
  if (s < 60) return `${s} s`;
  if (s < 3600) return `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, '0')} s`;
  return `${Math.floor(s / 3600)} h ${String(Math.floor(s % 3600 / 60)).padStart(2, '0')} min`;
}
function clock(t, date) {
  const d = new Date(t * 1000), two = x => String(x).padStart(2, '0');
  const time = `${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`;
  return date ? `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())} ${time}` : time;
}
function renderAlarms(s) {
  const eps = s.alarm_episodes.slice().reverse(), body = $('#alarms tbody');
  const sig = JSON.stringify(eps) + (eps.some(e => e.end == null) ? Math.floor(s.now) : '');
  if (body._sig !== sig) {
    body._sig = sig;
    body.replaceChildren(...eps.map(e => {
      const tr = h('tr', e.end == null ? 'on' : null);
      for (const text of [clock(e.start, true), e.station, e.desc,
                          duration((e.end ?? s.now) - e.start) + (e.end == null ? ' …' : ''),
                          e.end == null ? 'raised' : clock(e.end), e.detail]) {
        const td = h('td', null, text); td.title = text; tr.append(td);
      }
      return tr;
    }));
    if (!eps.length) { const tr = h('tr'); const td = h('td', null, 'no alarms this session'); td.colSpan = 6; tr.append(td); body.append(tr); }
  }
  const n = eps.filter(e => e.end == null).length, tab = $('#tab-alarms');
  setText(tab, n ? `Alarms · ${n} raised` : 'Alarms');
  tab.classList.toggle('red', n > 0);
}
function showLog(which) {
  $('#alarms').style.display = which === 'alarms' ? '' : 'none';
  $('#log').style.display = which === 'events' ? '' : 'none';
  $('#tab-alarms').classList.toggle('on', which === 'alarms');
  $('#tab-events').classList.toggle('on', which === 'events');
}
$('#tab-alarms').onclick = () => showLog('alarms');
$('#tab-events').onclick = () => showLog('events');

function render(s) {
  state = s; control = s.access.control;
  renderAccess(s.access);
  document.title = s.receivers.map(r => r.title).join(' · ') + ' – FM-Modmon-ms';
  const chips = $('#chips'), sig = JSON.stringify(s.chips);
  if (chips._sig !== sig) { chips._sig = sig; chips.replaceChildren(...s.chips.map(c => h('span', 'chip', c))); chips.style.display = 'contents'; }
  const cal = $('#cal');
  cal.disabled = !control || s.calibrating;
  setText(cal, s.calibrating ? '⟲  Calibrating…' : '⟲  Recalibrate gain');
  const add = $('#add');
  add.disabled = !control || !s.add.enabled; add.title = s.add.tip || '';
  // receivers: add new ones in receiver order, drop removed ones
  const want = new Set(s.receivers.map(r => r.receiver));
  for (const [n, p] of recv) if (!want.has(n)) { p.stop(); p.row.remove(); p.detail.remove(); recv.delete(n); }
  if (!want.has(selected)) selected = s.receivers.length ? s.receivers[0].receiver : null;
  const rows = $('#rows'), details = $('#details');
  s.receivers.forEach((r, i) => {
    let p = recv.get(r.receiver);
    if (!p) {
      p = buildReceiver(r, s.alarm_defs); recv.set(r.receiver, p);
      details.append(p.detail);
      p.row.classList.toggle('sel', p.n === selected); p.detail.style.display = p.n === selected ? '' : 'none';
    }
    if (rows.children[i] !== p.row) rows.insertBefore(p.row, rows.children[i] || null);
    updateReceiver(p, r);
  });
  for (const q of recv.values()) { q.row.classList.toggle('sel', q.n === selected); q.detail.style.display = q.n === selected ? '' : 'none'; }
  if (stereo.p && stereo.p.r) followStereo(stereo.p.r);
  if (mpxv.p && mpxv.p.r) followMpx(mpxv.p.r);
  renderAlarms(s);
  if (s.events_seq !== eventsSeq) {
    eventsSeq = s.events_seq;
    fetch('events.json').then(r => r.json()).then(ev => {
      const log = $('#log'); log.textContent = ev.slice().reverse().join('\n') || 'no events';
    }).catch(() => {});
  }
}

let polling = false;
async function poll(now) {
  if (polling && !now) return;
  polling = true;
  try {
    const sent = session.token;
    const r = await fetch('state.json', {cache: 'no-store', headers: {'X-FM-Modmon-Session': sent}});
    const s = await r.json();
    if (!info) await loadInfo();
    failures = 0; setText($('#conn'), '');
    document.body.style.opacity = '';
    // An answer to a request sent before signing in or out says nothing about
    // the sign-in now: drop it (the next one, a tenth of a second on, will do).
    if (s.ready && sent === session.token) render(s);
  } catch (e) {
    if (++failures > 5) { setText($('#conn'), 'FM-Modmon-ms is not answering…'); document.body.style.opacity = '0.6'; }
  } finally { polling = false; }
}
$('#add').onclick = () => api('add');
// Help: plain text from help.json, put on the page as text (never as HTML)
$('#help-btn').onclick = async () => {
  const dlg = $('#helpdlg');
  dlg.showModal();
  if (dlg._loaded) return;
  try {
    const {sections} = await (await fetch('help.json', {cache: 'no-store'})).json();
    const body = $('#help-body'), toc = $('#help-toc');
    body.replaceChildren(); toc.replaceChildren();
    sections.forEach(([title, kind, text], i) => {
      const hd = h('h3', null, title); body.append(hd);
      const link = h('a', null, title); link.onclick = () => hd.scrollIntoView({behavior: 'smooth'}); toc.append(link);
      if (kind === 'pre') body.append(h('pre', null, text));
      else for (const par of text.split(/\n\s*\n/)) body.append(h('p', null, par.replace(/\s*\n\s*/g, ' ')));
    });
    dlg._loaded = true;
  } catch (e) { $('#help-body').textContent = 'FM-Modmon-ms is not answering'; }
};
$('#help-close').onclick = () => $('#helpdlg').close();
$('#cal').onclick = () => confirm('Recalibrate the RSP1A gain now? Every receiver hears gain steps for a few seconds, and the meters restart.') && api('recalibrate');
$('#zoom').onclick = () => $('#zoom').style.display = 'none';
// 10 updates a second while the page is visible (as the app), one a second in the background
// (browsers slow a background tab's timers to about once a second, so go by elapsed time)
let lastPoll = 0;
setInterval(() => {
  if (!document.hidden || Date.now() - lastPoll >= 1000) { lastPoll = Date.now(); poll(); }
}, 100);
poll();
window.addEventListener('resize', () => { const p = recv.get(selected); if (p && p.r) updateReceiver(p, p.r); });
</script>
</body>
